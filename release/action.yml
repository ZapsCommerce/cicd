name: Release bookkeeping
description: >-
  pre: tag pre-vX.Y.Z at the commit that was live before this deploy (rollback point).
  release: after a healthy deploy, tag vX.Y.Z, move the `release` branch, delete the feat/ fix/
  hotfix/ branches it contains, and publish a GitHub Release and a comment on the prod PR.
  Needs `contents: write` (and `pull-requests: write` for mode release) on the calling job.

inputs:
  mode:
    description: "pre or release"
    required: true
  sha:
    description: Commit being deployed
    default: ${{ github.sha }}
  before:
    description: Prod commit before this push (mode pre)
    default: ${{ github.event.before }}
  token:
    description: Token for tags, branches, the GitHub Release and the PR comment
    default: ${{ github.token }}
  dry-run:
    description: "true = print what would happen, change nothing"
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}
    - name: Fetch all branches and tags
      shell: bash
      run: git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
    - name: Release bookkeeping (${{ inputs.mode }})
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SHA: ${{ inputs.sha }}
        BEFORE: ${{ inputs.before }}
        GH_TOKEN: ${{ inputs.token }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '' }}
        SCRIPT: ${{ github.action_path }}/release-after-deploy.sh
      run: |
        case "$MODE" in
          pre) bash "$SCRIPT" --pre "$SHA" "$BEFORE" ;;
          release) bash "$SCRIPT" "$SHA" ;;
          *) echo "::error::mode must be pre or release, not '$MODE'"; exit 2 ;;
        esac
