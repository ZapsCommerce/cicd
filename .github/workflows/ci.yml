name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Release script tests
        run: pytest -q
      - name: Shell syntax
        run: bash -n release/*.sh smoke/*.sh
      - name: Workflows and actions parse
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml') + glob.glob('*/action.yml')]"
      - name: Smoke action against a real page
        uses: ./smoke
        with:
          url: https://example.com
          tries: "2"
          wait: "5"
