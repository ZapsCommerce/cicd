name: Health check
description: >-
  Post-deploy smoke test: every page returns 200, optional security-header and API checks, optional
  apex -> site redirect. Retries while CloudFront settles. Fails the job when the site is unhealthy.

inputs:
  url:
    description: Site URL, e.g. https://www.example.com
    required: true
  apex:
    description: Apex domain that must 301 to the site URL (optional)
    default: ""
  pages:
    description: Space-separated paths that must return 200
    default: "/"
  require-csp:
    description: "true = fail when / has no Content-Security-Policy header"
    default: "false"
  api-path:
    description: API path to probe, e.g. /api/health (optional)
    default: ""
  api-method:
    default: GET
  api-body:
    description: JSON body for the probe (optional)
    default: ""
  api-expect:
    description: Expected status code of the probe
    default: "200"
  tries:
    default: "10"
  wait:
    description: Seconds between tries
    default: "15"

runs:
  using: composite
  steps:
    - name: Health check
      shell: bash
      env:
        SMOKE_PAGES: ${{ inputs.pages }}
        SMOKE_REQUIRE_CSP: ${{ inputs.require-csp == 'true' && '1' || '0' }}
        SMOKE_API_PATH: ${{ inputs.api-path }}
        SMOKE_API_METHOD: ${{ inputs.api-method }}
        SMOKE_API_BODY: ${{ inputs.api-body }}
        SMOKE_API_EXPECT: ${{ inputs.api-expect }}
        SMOKE_TRIES: ${{ inputs.tries }}
        SMOKE_WAIT: ${{ inputs.wait }}
        URL: ${{ inputs.url }}
        APEX: ${{ inputs.apex }}
      run: bash "${{ github.action_path }}/smoke.sh" "$URL" "$APEX"
